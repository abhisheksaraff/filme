# functions.yml
# Deploys the Supabase Edge Functions whenever their code changes on main.
name: Deploy functions

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", "supabase/config.toml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # --use-api bundles on Supabase's side, so no Docker is needed on the runner.
      # --yes answers the confirmation prompt, which a CI runner has no way to show.
      - run: supabase functions deploy --remote="${{ vars.SUPABASE_PROJECT_REF }}" --use-api --yes
