# keepalive.yml
# A free Supabase project pauses after a week without traffic; one request a week prevents that.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the API for its schema
        run: |
          curl --fail --silent --show-error --output /dev/null \
            "${{ vars.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}"
